<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>작업 요청서</title>
<style>
:root{--bg:#f8f8f8;--pn:#fff;--ctl:#f3f3f3;--hv:#ededed;--ln:#ededed;--bd:#e2e2e2;--bd2:#c7c7c7;--tx:#171717;--tx2:#525252;--mu:#666;--ok:#1e6b40;--wn:#a3410a;--er:#b42318;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.5 Inter,system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #9a9a9a;outline-offset:1px}
.sp{flex:1}
.mu{color:var(--mu);font-size:12px}
.er{color:var(--er)}.ok{color:var(--ok)}.wn{color:var(--wn)}
.mono{font-family:var(--mono);font-size:12px;line-height:1.6}

/* ---------- top bar ---------- */
header{display:flex;gap:10px;align-items:center;height:48px;padding:0 16px 0 20px;background:var(--pn);border-bottom:1px solid var(--bd);min-width:0}
.logo{position:relative;width:24px;height:24px;border-radius:6px;background:var(--tx);flex:none}
.logo::before{content:"";position:absolute;left:7px;top:5px;width:10px;height:14px;border-radius:2px;background:#fff}
.logo::after{content:"";position:absolute;left:9px;top:9px;width:6px;height:1.5px;background:var(--tx);box-shadow:0 3px 0 var(--tx),0 6px 0 var(--tx)}
.home{gap:10px;height:34px;margin-left:-6px;padding:0 8px 0 6px;background:transparent}
.home:hover{background:var(--ctl)}
.app{font-size:14px;font-weight:600;white-space:nowrap}
.kind{font-size:14px;font-weight:500;color:var(--tx);white-space:nowrap}
.resume{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--bd);border-radius:10px;background:#fafafa}
.resume-t{display:flex;align-items:center;gap:10px;min-width:0}
.resume-t b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{color:var(--bd2)}
.crumb{font-size:14px;color:var(--tx2);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);white-space:nowrap;margin-right:4px}
.saved::before{content:"";width:6px;height:6px;border-radius:3px;background:#2f9e5f}
.saved.no::before{background:#e86c13}
.notice{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;padding:3px 10px;border-radius:11px;background:#eef5ff;color:#0b4f94}

/* ---------- buttons ---------- */
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border:0;border-radius:6px;background:var(--ctl);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background-color .12s}
button:hover{background:var(--hv)}
button:disabled{cursor:not-allowed;opacity:.45}
button.pri{background:var(--tx);color:#fff}
button.pri:hover{background:#383838}
button.pri:disabled{background:#a3a3a3;opacity:1}
button.lg{height:34px;padding:0 20px}
button.gh{background:transparent;color:var(--tx2)}
button.gh:hover{background:var(--ctl);color:var(--tx)}
button.add{margin-top:12px}
.bar button.add{margin-top:0}
.ib{width:24px;height:24px;padding:0;border-radius:5px;background:transparent;color:var(--tx2);font-size:14px;font-weight:400;line-height:1}
.ib:hover{background:var(--hv);color:var(--tx)}
.ib:disabled{opacity:.25;background:transparent}

/* ---------- controls ---------- */
input[type=text],select,textarea{width:100%;max-width:100%;height:30px;padding:0 9px;border:1px solid transparent;border-radius:6px;background:var(--ctl);font-size:13px;transition:background-color .12s,border-color .12s}
input[type=text]:hover,select:hover,textarea:hover{border-color:var(--bd)}
input[type=text]:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--bd2);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
textarea{display:block;height:auto;min-height:30px;max-height:480px;padding:5px 9px;resize:vertical;line-height:1.55;overflow:auto}
select{cursor:pointer;padding-right:4px}
input[type=checkbox],input[type=radio]{accent-color:var(--tx);width:15px;height:15px;margin:0;flex:none;cursor:pointer}
::placeholder{color:#9b9b9b}
.tri{display:flex;gap:6px;align-items:flex-start;min-width:0}
.tri>select{flex:1;min-width:0}
.tri.on>select{flex:0 0 auto;width:auto;max-width:92px}
.tri.on>input{flex:1;min-width:0}
.tri.ml{flex-direction:column;align-items:stretch}
.tri.ml.on>select{max-width:none;align-self:flex-start}

/* ---------- layout ---------- */
#main{display:flex;height:calc(100% - 48px);min-height:0}
#nav{width:264px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--pn);border-right:1px solid var(--bd)}
.nav-body{flex:1;overflow:auto;padding:12px 10px 16px}
.nav-foot:empty{display:none}
.nav-foot{flex:none;padding:8px 10px 12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:1px}
#editor{flex:1;min-width:0;overflow:auto;padding:28px 36px 80px}
.wrap{max-width:1120px;margin:0 auto}

/* ---------- sidebar ---------- */
.cap{padding:14px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mu)}
.cap:first-child{padding-top:4px}
.nr{position:relative;display:flex;align-items:center;border-radius:6px;min-height:30px}
.nr:hover{background:var(--ctl)}
.nr.on{background:var(--hv)}
.ni{flex:1;min-width:0;justify-content:space-between;gap:8px;height:30px;padding:0 10px;background:transparent;font-weight:400;color:#383838;text-align:left}
.ni:hover{background:transparent}
.nr.on .ni{color:var(--tx);font-weight:600}
.nl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.nr.sub .ni{padding-left:10px}
.nr.dim .nl{color:#7a7a7a}
.nr .acts{display:none;position:absolute;right:4px;top:4px;gap:0;padding-left:8px;border-radius:5px;background:inherit}
.nr:hover .acts,.nr:focus-within .acts{display:flex}
.nr .acts .ib{width:22px;height:22px;font-size:13px}
.cnt{flex:none;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--ctl);color:var(--mu);font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.nr.on .cnt{background:#fff}
.ni .badge{height:18px;padding:0 7px;font-size:11px}
.ng{margin-bottom:2px}
.nh{display:flex;align-items:center;border-radius:6px}
.nh:hover{background:var(--ctl)}
.nh-t{flex:1;min-width:0;justify-content:flex-start;gap:6px;height:32px;padding:0 6px 0 4px;background:transparent;font-weight:500;color:var(--tx)}
.nh-t:hover{background:transparent}
.nh-t .cnt{margin-left:2px}
.chev{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex:none;color:var(--tx2)}
.chev::before{content:"";width:6px;height:6px;margin-left:-3px;border-right:1.75px solid currentColor;border-bottom:1.75px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.chev.open::before{margin:-4px 0 0;transform:rotate(45deg)}
.nh-l{font-weight:600}
.nh.empty .nh-t{color:var(--mu)}
.nh.empty .nh-l{font-weight:500}
.ng-items{margin:2px 0 6px 16px;padding-left:6px;border-left:1px solid var(--bd)}
.nr.sub .ni{color:var(--tx2)}
.nr.sub.on .ni{color:var(--tx)}
.nh .add-i{margin-right:4px;font-size:16px;color:var(--mu);opacity:0}
.nh:hover .add-i,.nh:focus-within .add-i{opacity:1}
.nav-foot .nr.on{background:var(--hv)}

/* ---------- page head ---------- */
.ph{margin:0 0 18px}
.eyebrow{font-size:12px;font-weight:500;color:var(--mu);margin-bottom:4px}
.ph-t{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:32px}
.ph h1{margin:0;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.01em;word-break:break-word}
.ph-m{display:inline-flex;align-items:center;gap:8px}
.idchip{font-family:var(--mono);font-size:11px;color:var(--mu);background:var(--ctl);border-radius:4px;padding:2px 6px}

/* ---------- card & sections ---------- */
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.sec{padding:22px 24px 24px;overflow-x:auto}
.sec+.sec{border-top:1px solid var(--ln)}
.card>.note{margin:0;padding:14px 24px 18px;border-top:1px solid var(--ln)}
.sec-h{margin-bottom:14px}
.sec-h h2{margin:0;font-size:14px;font-weight:600;line-height:1.4}
.sec-h p{margin:2px 0 0;font-size:12px;color:var(--mu)}
.sec>.sec-h:last-child{margin-bottom:0}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;align-items:start}
.form.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form.c4{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px}
.fld{min-width:0}
.fld.wide,.check.wide{grid-column:1/-1}
.fl{display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--tx2)}
.help{margin-top:5px;font-size:12px;color:var(--mu)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}

/* ---------- tables ---------- */
.tbl{width:100%;min-width:640px;border-collapse:separate;border-spacing:0;border:1px solid var(--bd);border-radius:8px;table-layout:fixed}
.tbl th{height:34px;padding:0 10px;background:#f8f8f8;border-bottom:1px solid var(--bd);text-align:left;font-size:12px;font-weight:500;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl th:first-child{border-top-left-radius:8px}.tbl th:last-child{border-top-right-radius:8px}
.tbl td{padding:5px 6px;border-top:1px solid var(--ln);vertical-align:top;background:var(--pn)}
.tbl tbody tr:first-child td{border-top:0}
.tbl tbody tr:last-child td:first-child{border-bottom-left-radius:8px}.tbl tbody tr:last-child td:last-child{border-bottom-right-radius:8px}
.tbl td.idx{padding:11px 0 0;text-align:center;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.tbl td.acts{padding:8px 6px 0 0;text-align:right;white-space:nowrap}
.tbl td input[type=text],.tbl td select,.tbl td textarea{background:transparent}
.tbl td input[type=text]:hover,.tbl td select:hover,.tbl td textarea:hover{background:var(--ctl);border-color:transparent}
.tbl td input[type=text]:focus,.tbl td select:focus,.tbl td textarea:focus{background:#fff;border-color:var(--bd2)}
.tbl td textarea{min-height:30px}
.tbl tr:hover td{background:#fcfcfc}
.rb{display:inline-flex;opacity:.4;transition:opacity .12s}
.tbl tr:hover .rb,.tbl tr:focus-within .rb,.box:hover .rb,.box:focus-within .rb{opacity:1}
.tog{margin-left:2px}
.tbl tr.open .tog{background:var(--hv);color:var(--tx)}
.tbl tr.brk td,.tbl tr.brk:hover td{background:#fafafa}
.tbl tr.brk td input[type=text]{font-weight:600}
.tbl tr.sug td,.tbl tr.sug:hover td{background:#fffcf0}
.tbl tr.sug.on td,.tbl tr.sug.on:hover td{background:#f5fbf7}
.tbl td.mid{text-align:center;padding-top:12px}
.badge.cond{height:20px;padding:0 7px;font-size:11px;cursor:help}
.tbl td.mid .badge{margin-top:-3px}
.form>.wide{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:10px 28px}
.help-i{margin-left:6px;font-size:12px;color:var(--mu)}
.note-i{padding:8px 12px;border-radius:6px;background:#f8f8f8;font-size:12px;color:var(--tx2)}
.dev{margin-top:18px;padding:10px 12px;border:1px dashed var(--bd);border-radius:8px;background:#fcfcfc}
.dev-t{margin-bottom:8px;font-size:12px;font-weight:600;color:var(--tx2)}
.dev-t .mu{font-weight:400}
.dev-l{display:flex;flex-wrap:wrap;gap:6px}
.dev-i{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;background:var(--ctl);font-size:12px;color:var(--tx2);overflow-wrap:anywhere}
.dev-k{color:var(--mu)}
.lst{display:flex;flex-direction:column;gap:6px}
.lst-r{display:flex;align-items:center;gap:8px}
.lst-b{flex:none;width:5px;height:5px;margin-left:4px;border-radius:50%;background:var(--bd2)}
.lst-r .ib{opacity:.45}
.lst-r:hover .ib,.lst-r:focus-within .ib{opacity:1}
button.lst-add{align-self:flex-start;height:26px;margin-left:5px;padding:0 8px;font-size:12px}
.more-w{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:16px}
.more{display:flex;flex-wrap:wrap;gap:6px}
button.chip-b{height:26px;padding:0 10px;border:1px dashed var(--bd2);border-radius:13px;font-size:12px;font-weight:400}
.rights{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px 16px}
.tbl tr.det td,.tbl tr.det:hover td{padding:14px 18px 18px 52px;background:#f8f8f8;border-top:1px dashed var(--bd)}
.tbl tr.det input[type=text],.tbl tr.det select,.tbl tr.det textarea{background:#fff;border-color:var(--bd)}
.det-h{margin-bottom:12px;font-size:12px;font-weight:600;color:var(--tx2)}
.tbl tr.empty td{padding:18px;text-align:center;color:var(--mu);font-size:12px}
.origin{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding-top:3px}
.adopt{height:24px;padding:0 10px;border:1px solid var(--bd2);background:#fff;color:var(--tx2);font-size:12px}
.adopt:hover{background:var(--ctl);color:var(--tx)}
.adopt.on{border-color:transparent;background:#e6f7ec;color:var(--ok)}
.o-req{font-size:12px;color:var(--mu)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:-6px 0 18px;font-size:12px;color:var(--mu)}
.lg-t{font-weight:600;color:var(--tx2)}
.lg-i{display:inline-flex;align-items:center;gap:6px}
.legend .badge{height:20px;padding:0 8px;font-size:11px}
select.unset{color:#8f8f8f}
select.unset option{color:var(--tx)}
button.sm-t{height:26px;padding:0 10px;font-size:12px}
.dec .q{min-height:30px;padding:4px 8px;margin:0 -8px;width:calc(100% + 16px);background:transparent;font-size:15px;font-weight:600;line-height:1.45}
.dec .q:hover{background:var(--ctl)}
.dec .q{resize:none;overflow:hidden}
.tbl .origin{min-height:30px;padding-top:0}
.dec-a{margin:14px 0 0}
.dec-a>.fl{margin-bottom:8px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.choice{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:pointer;transition:border-color .12s,background-color .12s}
.choice:hover{border-color:var(--bd2)}
.choice.on{border-color:var(--tx);background:#fafafa;box-shadow:inset 0 0 0 1px var(--tx)}
.choice>span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;line-height:1.45}
.choice.other>span{flex:none}
.choice.other{grid-column:1/-1}
.choice.other input[type=text]{flex:1;min-width:0;height:28px;background:var(--ctl)}
.choice.other input[type=text]:disabled{opacity:.5}
.dec-a button.sm-t{margin-top:8px}
.dec .fld{margin-top:14px}
.dec-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--ln)}
.box.done{border-color:#cdebd8}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:11px;border:0;background:var(--ctl);color:var(--tx2);font-size:12px;font-weight:500;white-space:nowrap}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.8}
select.badge{width:auto;height:24px;padding:0 4px 0 9px;cursor:pointer}
select.badge:hover{border-color:transparent;filter:brightness(.97)}
select.badge.plain{background:transparent;color:var(--mu);font-weight:400}
select.badge.plain:hover{background:var(--ctl);filter:none}
.b-suggestion{background:#fff3c4;color:#7a4b00}
.b-technical{background:#efebff;color:#4b32a8}
.b-request{background:#e6f7ec;color:var(--ok)}
.b-decision{background:#ffeded;color:var(--er)}
.b-draft{background:#fff1e5;color:var(--wn)}

/* ---------- blocks ---------- */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.bar.end{margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:12px}
.box{border:1px solid var(--bd);border-radius:10px;padding:14px 16px 18px;background:var(--pn)}
.box.need{border-color:#f2c7c2}
.box-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.blank{padding:22px;text-align:center;color:var(--mu);font-size:12px;border:1px dashed var(--bd);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.stat{border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.sv{font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.sl{margin-top:2px;font-size:12px;color:var(--mu)}
.callout{padding:12px 14px;border-radius:8px;background:#f8f8f8;color:var(--tx2);border:1px solid var(--ln)}
.callout ul{margin:6px 0 0;padding-left:18px}.callout li{margin:3px 0}
.c-er{background:#fff5f4;border-color:#fad7d3;color:#8f1d13}
.c-ok{background:#f0faf4;border-color:#cdebd8;color:var(--ok)}
.c-wn{background:#fff8ee;border-color:#f6dcbc;color:#7a3a06}
.callout+.note,.callout+.confirm-row{margin-top:14px}
.note{margin:12px 0 0;font-size:12px;color:var(--mu)}
.confirm-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 14px 12px 16px;border:1px solid var(--bd);border-radius:10px;background:#fafafa}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px;height:auto;padding:16px 18px;border:1px solid var(--bd);border-radius:10px;background:#fff;text-align:left;white-space:normal;transition:border-color .12s,box-shadow .12s}
.tcard:hover{background:#fff;border-color:var(--bd2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tk{font-family:var(--mono);font-size:11px;color:var(--mu)}
.tt{font-size:15px;font-weight:600}
.td{font-size:12px;font-weight:400;color:var(--mu);line-height:1.5}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:26px;border:1px dashed var(--bd2);border-radius:10px;background:#fafafa;cursor:pointer;transition:background-color .12s}
.drop:hover{background:var(--ctl)}
.drop:focus-within{outline:2px solid #9a9a9a;outline-offset:1px}
.drop-t{font-weight:500}
.drop input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}


/* ---------- review screens ---------- */
.sec-h.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lnk{height:auto;padding:0;background:none;color:var(--lk,#0b5ca8);font-weight:500;text-decoration:underline;text-underline-offset:2px;white-space:normal;display:inline}
.lnk:hover{background:none;color:#08467f}
.para{margin:0;line-height:1.65;white-space:pre-wrap}
.para.tgt{margin-top:14px}
.bul{margin:0;padding-left:18px;line-height:1.7}
.mt{margin-top:16px}
.cap2{margin-bottom:6px;font-size:12px;font-weight:600;color:var(--mu)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.qbox{padding:14px 16px;border:1px solid var(--bd);border-radius:10px;background:#fafafa}
.qbox.ai{background:#fff}
.qbox blockquote{margin:0;padding-left:12px;border-left:3px solid var(--bd2);white-space:pre-wrap;line-height:1.65}
.kv2{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.kv2>div{display:flex;gap:12px}.kv2 .k{flex:none;width:56px;font-size:12px;font-weight:600;color:var(--mu);padding-top:1px}
.cmp-b,.cmp-a{padding:14px 16px;border-radius:10px;border:1px solid var(--bd)}
.cmp-b{background:#fff8f7;border-color:#f6d3cf}
.cmp-a{background:#f3faf6;border-color:#cdebd8}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:0;padding:0;list-style:none}

<script>
(function () {
'use strict';
/* ===== constants ===== */
var FIELD_TYPES = ['Data', 'Int', 'Float', 'Currency', 'Check', 'Select', 'Link', 'Dynamic Link', 'Table', 'Table MultiSelect',
	'Date', 'Datetime', 'Time', 'Text', 'Small Text', 'Long Text', 'Text Editor', 'Attach', 'Attach Image', 'Percent', 'Rating',
	'Color', 'JSON', 'Section Break', 'Column Break', 'Tab Break'];
var BREAKS = ['Section Break', 'Column Break', 'Tab Break'];
var RIGHTS = ['read', 'write', 'create', 'delete', 'submit', 'cancel', 'amend', 'report', 'export', 'print', 'email', 'share'];
var YESNO = [[true, '예'], [false, '아니오']];
var LS_KEY = 'frappe-harness-spec-draft';
var BLOCKS = [['doctypes', 'DocType', 'dt'], ['permissions', '권한', 'perm'], ['workflows', '워크플로', 'wf'],
	['ui', 'UI/UX', 'ui'], ['reports', '리포트', 'rp'], ['business_rules', '업무 규칙/API', 'br']];
var BASIC = {
	feature: [['name', '기능 이름'], ['app', '대상 App'], ['module', 'Module'], ['purpose', '목적', 'ml'], ['users', '실제 사용자', 'ml'],
		['flow', '업무 흐름', 'ml'], ['scope', '구현 범위', 'ml'], ['out_of_scope', '제외 범위', 'list']],
	change: [['name', '변경 이름'], ['app', '대상 App'], ['module', 'Module'], ['target', '대상 (기능/DocType/화면)'],
		['current_behavior', '현재 동작', 'ml'], ['desired_behavior', '바꿀 동작', 'ml'], ['preserve', '유지할 동작', 'list'],
		['data_handling', '기존 데이터 처리', 'ml'], ['out_of_scope', '제외 범위', 'list']],
	bug: [['name', '버그 이름'], ['app', '대상 App'], ['module', 'Module'], ['target', '대상'], ['actual', '실제 현상', 'ml'],
		['reproduction', '재현 조건/방법', 'ml'], ['expected', '기대 동작', 'ml'], ['evidence', '오류 메시지/증거', 'ml']]
};
var TRI = { // tri-value properties checked by the validator, per block kind
	doctypes: ['naming', 'kind', 'submittable', 'track_changes'],
	fields: ['fieldtype', 'required', 'unique', 'options', 'default', 'read_only', 'hidden', 'in_list_view', 'in_standard_filter'],
	rights: RIGHTS, workflows: ['docstatus_meaning'], states: ['docstatus'], ui: ['mode'], reports: ['report_type'], permissions: ['if_owner']

/* ===== pure logic (no DOM) ===== */
function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }
function clone(v) { return JSON.parse(JSON.stringify(v)); }
function nonEmpty(v) { return typeof v === 'string' && v.trim() !== ''; }
function isWrapper(v) { return isObj(v) && Object.keys(v).length === 1 && (v.mode === 'auto' || v.mode === 'none'); }
function wrap(mode) { return { mode: mode }; }
function unresolved(d) { return !isObj(d) || d.answer === undefined || d.answer === null || (typeof d.answer === 'string' && d.answer.trim() === ''); }
function asArr(v) { return Array.isArray(v) ? v : []; }

function walk(n, fn, path, listName) {
	if (Array.isArray(n)) {
		var nm = (path || '').split('.').pop().split('[')[0];
		n.forEach(function (x, i) { walk(x, fn, path + '[' + i + ']', nm); });
	} else if (isObj(n)) {
		fn(n, path, listName);
		Object.keys(n).forEach(function (k) { walk(n[k], fn, path ? path + '.' + k : k, null); });
	}

function genId(spec, prefix) {
	var used = {}, n = 1;
	walk(spec, function (d) { if (typeof d.id === 'string') used[d.id] = 1; }, '', null);
	while (used[prefix + n]) n++;
	return prefix + n;

/* Adds missing ids; turns plain-string acceptance/rules into {id,text}. Nothing else changes. */
function normalize(spec) {
	function fix(list, prefix, textual) {
		list.forEach(function (it, i) {
			if (textual && typeof it === 'string') { list[i] = it = { text: it }; }

		});
	}
	if (Array.isArray(spec.acceptance_criteria)) fix(spec.acceptance_criteria, 'ac', true);
	[['open_decisions', 'od'], ['decisions', 'dc'], ['doctypes', 'dt'], ['permissions', 'perm'], ['workflows', 'wf'],
		['ui', 'ui'], ['reports', 'rp'], ['business_rules', 'br']].forEach(function (p) {
		if (Array.isArray(spec[p[0]])) fix(spec[p[0]], p[1], false);
	});
	asArr(spec.doctypes).forEach(function (dt) {
		if (!isObj(dt)) return;
		if (Array.isArray(dt.fields)) fix(dt.fields, 'f', false);
		if (Array.isArray(dt.rules)) fix(dt.rules, 'r', true);
	});

/* Remove unselected suggestions anywhere; selected ones become requests. Returns a new tree. */
function strip(n) {
	if (Array.isArray(n)) {
		var out = [];
		n.forEach(function (x) {
			if (isObj(x) && x.origin === 'suggestion') {
				if (x.selected !== true) return;
				var y = strip(x);
				delete y.selected;
				delete y.suggestion_group;
				y.origin = 'request';
				y.adopted_from_suggestion = true;
				out.push(y);
			} else out.push(strip(x));
		});
		return out;
	}
	if (isObj(n)) {
		var o = {};
		Object.keys(n).forEach(function (k) { o[k] = strip(n[k]); });
		return o;
	}
	return n;

function basicsMissing(spec) {
	var need = { feature: ['name', 'app', 'purpose'], change: ['target', 'desired_behavior'], bug: ['target', 'actual', 'expected'] }[spec.type] || [];
	var miss = need.filter(function (k) { return !nonEmpty(spec[k]); });
	if (spec.type === 'feature' || spec.type === 'change') {
		var n = asArr(spec.acceptance_criteria).filter(function (c) { return nonEmpty(c) || (isObj(c) && nonEmpty(c.text)); }).length;
		if (!n) miss.push('acceptance_criteria');
	}
	return miss;

/* Confirm: returns {ok, reasons, spec}. Nothing is mutated; the caller swaps in `spec` when ok. */
function confirmSpec(spec, approved) {
	var reasons = [];
	if (!approved) reasons.push('"이 내용으로 개발을 승인합니다"에 체크해야 합니다.');
	asArr(spec.open_decisions).forEach(function (d) {
		if (isObj(d) && d.required === true && unresolved(d)) reasons.push('필수 결정이 미해결입니다: ' + (d.question || d.id || '?'));
	});
	conflicts(spec).forEach(function (m) { reasons.push(m); });
	validateSpec(spec).forEach(function (m) { reasons.push('검증 문제: ' + m); });
	var out = strip(spec);
	delete out.suggestions;
	if (Array.isArray(out.open_decisions) || Array.isArray(out.decisions)) {
		var moved = asArr(out.open_decisions).filter(function (d) { return isObj(d) && !unresolved(d); })
			.map(function (d) { return { id: d.id, question: d.question, answer: d.answer }; });
		out.decisions = asArr(out.decisions).concat(moved);
		if ('open_decisions' in out) out.open_decisions = [];
	}
	out.status = 'confirmed';
	out.confirmed_at = new Date().toISOString();
	validateSpec(out).forEach(function (m) { reasons.push('확정본 검증 문제: ' + m); });

/* ----- review helpers ----- */
function optVal(o) { return isObj(o) ? o.value : o; }

	walk(spec, function (d, path, list) {

			if (it.origin === 'technical' && !expanded['blk:' + it.id]) {
				body = [sec(null, null, h('div', { class: 'callout' }, '요청에 없어서 AI가 정한 항목입니다. 생각과 다르면 펼쳐서 고치세요.'),
					h('div', { class: 'bar' }, btn('펼쳐서 편집', function () { expanded['blk:' + it.id] = true; renderEditor(); })))];
			} else body = fn(list, i);
		}
	}
	if (spec && !body) {
		var k = sel.k in TITLES ? sel.k : 'overview';
		if (k !== sel.k) sel = { k: k };
		head = k === 'overview' ? null : pageHead(null, TITLES[k]);
		if (k === 'acceptance') head = h('div', null, head, originLegend(spec.acceptance_criteria || []));
		body = { overview: reviewPage, suggestions: suggestionsEditor, basics: basicsEditor, acceptance: acceptanceEditor, decisions: decisionsEditor, verify: verifyEditor, preview: previewEditor, io: ioEditor }[k]();
	}
	var isReview = !!spec && sel.k === 'overview';
	document.body.classList.toggle('is-review', isReview);
	ed.appendChild(isReview ? h('div', { class: 'wrap rv' }, body) : h('div', { class: 'wrap' }, head, h('div', { class: 'card' }, spec ? dtDatalist() : null, body)));
	[].forEach.call(ed.querySelectorAll('textarea'), fit);
}
function fit(el) {
	if (el.classList.contains('mono') || !el.isConnected) return;
	el.style.height = 'auto';
	el.style.height = Math.min(el.scrollHeight + 2, 480) + 'px';
}
document.addEventListener('input', function (e) { if (e.target && e.target.tagName === 'TEXTAREA') fit(e.target); });
function renderAll() { renderTop(); renderNav(); renderEditor(); }

/* ===== per-spec browser drafts ===== */
function keyFor(s) { return LS_PREFIX + (nonEmpty(s.id) ? s.id : (s.type || 'spec') + '-' + Date.now()); }
function drafts() {
	var out = [];
	try {
		for (var i = 0; i < localStorage.length; i++) {
			var k = localStorage.key(i);
			if (k.indexOf(LS_PREFIX) !== 0) continue;
			try { var x = JSON.parse(localStorage.getItem(k)); if (isObj(x) && isObj(x.spec)) out.push({ key: k, spec: x.spec, saved_at: x.saved_at }); } catch (e) { /* skip broken */ }
		}
	} catch (e) { /* no storage */ }
	return out.sort(function (a, b) { return String(b.saved_at).localeCompare(String(a.saved_at)); });
}
function readDraft(k) { try { var x = JSON.parse(localStorage.getItem(k)); return isObj(x) && isObj(x.spec) ? x : null; } catch (e) { return null; } }
function openDraft(x) {
	spec = normalize(x.spec); draftKey = x.key; savedAt = new Date(x.saved_at); saveOK = true;
	lastExport = ''; restoreOffer = null; approved = false; notice = '임시 저장본을 열었습니다.';
	sel = { k: 'overview' }; renderAll();
}

/* ===== import / export ===== */
function newSpec(type) {
	spec = { schema_version: '1.0', type: type, status: 'draft' };
	draftKey = null; lastExport = ''; restoreOffer = null;
	sel = { k: 'basics' };
	notice = '';
	approved = false;
	save(); renderAll();
}
function importText(text) {
	var data;
	try { data = JSON.parse(text); } catch (e) { notice = 'JSON 해석 실패: ' + e.message; renderTop(); return; }
	if (!isObj(data)) { notice = '최상위가 JSON 객체여야 합니다.'; renderTop(); return; }
	spec = normalize(data);
	draftKey = keyFor(spec); lastExport = JSON.stringify(spec); restoreOffer = null; savedAt = null;
	if (!BASIC[spec.type]) { notice = 'type이 올바르지 않아 feature로 취급합니다. 검증 패널을 확인하세요.'; }
	else notice = '불러왔습니다.';
	sel = { k: 'overview' };
	approved = false;
	renderAll();
}
function exportJson() {
	var name = String(spec.id || 'spec-' + spec.type).replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || 'spec';
	var blob = new Blob([JSON.stringify(spec, null, 2) + '\n'], { type: 'application/json' });
	var url = URL.createObjectURL(blob), a = document.createElement('a');
	a.href = url; a.download = name + '.json';
	document.body.appendChild(a); a.click(); document.body.removeChild(a);
	setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
	lastExport = JSON.stringify(spec);
	notice = 'JSON을 내보냈습니다 (내보내기는 확정이 아닙니다).';
	renderTop();
}

/* ===== boot ===== */
function boot() {
	try {
		var old = localStorage.getItem(LS_KEY);
		if (old) { var o = JSON.parse(old); if (isObj(o)) localStorage.setItem(keyFor(o), JSON.stringify({ saved_at: new Date().toISOString(), spec: o })); localStorage.removeItem(LS_KEY); }
	} catch (e) { /* ignore */ }
	var el = $('spec-data'), raw = el ? el.textContent.trim() : '';
	if (raw) {
		try {
			var data = JSON.parse(raw);
			if (isObj(data)) {
				spec = normalize(data); sel = { k: 'overview' };
				draftKey = keyFor(spec); lastExport = JSON.stringify(spec);
				var st = readDraft(draftKey);
				if (st && JSON.stringify(normalize(st.spec)) !== lastExport) restoreOffer = st;
			}
		} catch (e) { notice = '내장된 요청서 JSON을 해석하지 못했습니다.'; }
	}
	renderAll();
}
if (typeof module !== 'undefined') module.exports = { strip: strip, confirmSpec: confirmSpec, validateSpec: validateSpec, toMarkdown: toMarkdown, normalize: normalize };
else boot();
})();
